<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predict - {{ dataset }} - RLT Platform</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modern-styles.css') }}">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-logo">🌲 RLT Platform</a>
            <div class="nav-menu">
                <a href="/" class="nav-link">Home</a>
                <a href="/datasets" class="nav-link">Datasets</a>
                <a href="/insights" class="nav-link">Global Insights</a>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <div class="page-header">
        <div class="container-wide">
            <a href="/datasets" class="back-link">← Back to Datasets</a>
            <h1 id="dataset-title">{{ dataset }}</h1>
            <p id="dataset-description"></p>
        </div>
    </div>

    <div class="container-wide">
        <!-- Dataset Info Card -->
        <div class="info-card" id="dataset-info-card">
            <!-- Populated by JavaScript -->
        </div>

        <!-- Features Input Section -->
        <section class="predict-section">
            <div class="section-header">
                <h2>📝 Input Features</h2>
                <div class="action-buttons">
                    <button id="random-fill-btn" class="btn btn-secondary">
                        🎲 Random Fill
                    </button>
                    <button id="clear-form-btn" class="btn btn-outline">
                        🗑️ Clear
                    </button>
                </div>
            </div>
            
            <form id="features-form">
                <div id="features-inputs" class="features-grid-modern">
                    <!-- Generated by JavaScript -->
                </div>
                <button type="submit" class="btn btn-primary btn-lg btn-full">
                    🚀 Compare All Models
                </button>
            </form>
        </section>

        <!-- Results Section -->
        <section id="results-section" class="predict-section hidden">
            <h2>📈 Model Predictions</h2>
            <div id="loading" class="loading hidden">
                <div class="spinner"></div>
                <p>Running predictions...</p>
            </div>
            <div id="results-grid" class="results-grid-modern">
                <!-- Generated by JavaScript -->
            </div>
        </section>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container-wide">
            <p>&copy; 2024 RLT Research Platform</p>
        </div>
    </footer>

    <script>
        const DATASET_NAME = "{{ dataset }}";
    </script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
